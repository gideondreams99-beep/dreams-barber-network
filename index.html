<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJ'S SALOON</title>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #1a1a1a; 
      color: white; 
      text-align: center; 
      padding: 15px; 
      margin: 0;
    }
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      background-color: #4285F4; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
    }
    img { 
      border-radius: 50%; 
      width: 80px; 
      height: 80px; 
      border: 3px solid #d4af37;
      margin-bottom: 5px;
    }
    #dashboard { display: none; margin-top: 15px; }
    #userRole {
      background-color: #333;
      display: inline-block;
      padding: 5px 15px;
      border-radius: 15px;
      margin-top: 5px;
      color: #d4af37;
      font-weight: bold;
      font-size: 14px;
    }
    
    /* PANEL STYLES */
    .panel {
      background-color: #222;
      border: 1px solid #d4af37;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
    }
    .panel h3 { margin-top: 0; color: #d4af37; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background-color: #111;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn-submit { background-color: #28a745; width: 100%; font-weight: bold; }
    
    /* LIVE QUEUE TICKETS */
    .ticket {
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 5px solid #d4af37;
    }
    .ticket-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .ticket-details { font-size: 14px; color: #bbb; margin-bottom: 10px; }
    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 10px;
      background-color: #ffc107;
      color: black;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }
    
    /* NEW: ACTION BUTTONS */
    .btn-action { width: 100%; padding: 10px; font-size: 15px; font-weight: bold; border-radius: 5px; margin-top: 5px; }
    .btn-finish { background-color: #007bff; color: white; }
    .btn-pay { background-color: #28a745; color: white; }
  </style>
</head>
<body>

  <h1>SJ'S SALOON</h1>
  <p id="statusText">Please log in to continue.</p>
  
  <button id="loginBtn">Sign in with Google</button>

  <div id="dashboard">
    <img id="userPic" src="" alt="Profile Picture">
    <h3 id="userName" style="margin:0;"></h3>
    <div id="userRole">Role: LOADING...</div>
    
    <!-- SECRETARY FRONT DESK PANEL (Hidden from Barbers) -->
    <div id="secretaryPanel" class="panel" style="display: none;">
      <h3>Front Desk Intake</h3>
      <label>Customer Name:</label>
      <input type="text" id="custName" placeholder="Enter name...">

      <label>Select Service:</label>
      <select id="serviceType">
        <option value="Adult Fade|50">Adult Fade - 50.00</option>
        <option value="Line-Up|20">Line-Up - 20.00</option>
        <option value="Kids Cut|30">Kids Cut - 30.00</option>
      </select>

      <label>Assign To:</label>
      <select id="barberName">
        <option value="Angel">Angel</option>
        <option value="Gideon">Gideon</option>
      </select>

      <button id="sendBtn" class="btn-submit">Send to Barber Chair</button>
    </div>

    <!-- LIVE SHOP QUEUE (Visible to Everyone) -->
    <div id="queuePanel" class="panel" style="display: none;">
      <h3>Live Shop Queue</h3>
      <div id="queueList">
        <!-- Tickets appear here -->
      </div>
    </div>
    
    <button id="logoutBtn" style="background-color: #ff4444; margin-top: 30px;">Log Out</button>
  </div>

  <script type="module" defer>
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    
    // NEW: Imported 'doc' and 'updateDoc' to change ticket statuses
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0YvP-aj1a_ReSpYlOuyS0FM6WlbrP7aI",
      authDomain: "sjs-saloon.firebaseapp.com",
      projectId: "sjs-saloon",
      storageBucket: "sjs-saloon.firebasestorage.app",
      messagingSenderId: "346208182886",
      appId: "1:346208182886:web:0766d465a0c628bd5c03a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentRole = ""; // Stores the role so the app knows which buttons to show

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const dashboard = document.getElementById('dashboard');
    const statusText = document.getElementById('statusText');
    const userRoleDisplay = document.getElementById('userRole');
    const secretaryPanel = document.getElementById('secretaryPanel');
    const queuePanel = document.getElementById('queuePanel');

    loginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      signInWithPopup(auth, provider).catch((error) => alert("Login failed: " + error.message));
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => window.location.reload());
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        statusText.style.display = "none";
        dashboard.style.display = "block";
        queuePanel.style.display = "block"; // Everyone sees the queue
        
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userPic').src = user.photoURL;

        // Check Role
        if (user.email === "gismartsghana@gmail.com") {
          currentRole = "owner";
          userRoleDisplay.innerText = "👑 ROLE: SHOP OWNER";
          secretaryPanel.style.display = "block"; 
        } else if (user.email === "kuukua@gmail.com") {
          currentRole = "secretary";
          userRoleDisplay.innerText = "👩‍💼 ROLE: SECRETARY";
          secretaryPanel.style.display = "block";
        } else {
          currentRole = "barber";
          userRoleDisplay.innerText = "👤 ROLE: BARBER";
        }

        startLiveQueue(); 

      } else {
        loginBtn.style.display = "inline-block";
        statusText.style.display = "block";
        dashboard.style.display = "none";
      }
    });

    // --- FRONT DESK LOGIC ---
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const name = document.getElementById('custName').value;
      const serviceData = document.getElementById('serviceType').value.split('|'); 
      const barber = document.getElementById('barberName').value;

      if (name.trim() === "") return alert("Please enter the customer's name!");

      try {
        await addDoc(collection(db, "daily_tickets"), {
          customerName: name,
          serviceName: serviceData[0],
          price: Number(serviceData[1]),
          assignedBarber: barber,
          status: "in_progress",
          timestamp: new Date().getTime()
        });
        document.getElementById('custName').value = "";
      } catch (error) {
        alert("Error saving: " + error.message);
      }
    });

    // --- NEW: TICKET UPDATE SYSTEM ---
    // Attaching this to window so the HTML buttons can click it
    window.updateTicketStatus = async (ticketId, newStatus) => {
      try {
        const ticketRef = doc(db, "daily_tickets", ticketId);
        await updateDoc(ticketRef, { status: newStatus });
      } catch (error) {
        alert("Action failed: " + error.message);
      }
    };

    // --- LIVE QUEUE DISPLAY LOGIC ---
    function startLiveQueue() {
      const queueList = document.getElementById('queueList');
      
      onSnapshot(collection(db, "daily_tickets"), (snapshot) => {
        let html = "";
        
        snapshot.forEach((docSnap) => {
          const ticket = docSnap.data();
          const ticketId = docSnap.id; 
          
          if (ticket.status !== "paid") {
            let actionButton = "";
            
            // Show FINISH CUT button to Barbers and Owners
            if (ticket.status === "in_progress" && (currentRole === "barber" || currentRole === "owner")) {
               actionButton = `<button class="btn-action btn-finish" onclick="updateTicketStatus('${ticketId}', 'completed')">Finish Cut</button>`;
            } 
            // Show COLLECT PAYMENT button to Secretary and Owners
            else if (ticket.status === "completed" && (currentRole === "secretary" || currentRole === "owner")) {
               actionButton = `<button class="btn-action btn-pay" onclick="updateTicketStatus('${ticketId}', 'paid')">Collect Payment</button>`;
            }

            html += `
              <div class="ticket">
                <div class="ticket-title">${ticket.customerName}</div>
                <div class="ticket-details">
                  ${ticket.serviceName} - GHS ${ticket.price.toFixed(2)} <br>
                  Assigned to: <strong>${ticket.assignedBarber}</strong>
                </div>
                <span class="status-badge">${ticket.status.toUpperCase().replace('_', ' ')}</span>
                ${actionButton}
              </div>
            `;
          }
        });
        
        queueList.innerHTML = html === "" ? "<p style='color:#bbb;'>No active customers in the shop.</p>" : html;
      });
    }
  </script>
</body>
</html>
