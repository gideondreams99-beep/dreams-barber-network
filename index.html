<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJ'S SALOON</title>
  <style>
    /* PREMIUM DARK METALLIC THEME */
    body { 
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #e0e0e0; 
      text-align: center; 
      padding: 15px; 
      margin: 0;
      min-height: 100vh;
    }

    h1 {
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4af37;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      margin-top: 10px;
    }

    /* POLISHED BUTTONS */
    button { 
      padding: 14px 24px; 
      font-size: 16px; 
      font-weight: bold;
      background: linear-gradient(145deg, #333, #111);
      color: #d4af37; 
      border: 1px solid #555; 
      border-radius: 8px; 
      cursor: pointer;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button:active {
      box-shadow: inset 2px 2px 5px rgba(0,0,0,0.8);
    }
    
    #loginBtn { background: linear-gradient(145deg, #1a4b8c, #0a2342); color: white; border-color: #2a6bcc; }
    #logoutBtn { background: linear-gradient(145deg, #8c1a1a, #420a0a); color: white; border-color: #cc2a2a; margin-top: 30px; width: 100%; }

    /* USER PROFILE */
    img { 
      border-radius: 50%; 
      width: 90px; 
      height: 90px; 
      border: 2px solid #d4af37;
      margin-bottom: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    #dashboard { display: none; margin-top: 15px; }
    #userName { margin: 5px 0 0 0; letter-spacing: 1px; }
    
    #userRole {
      background: linear-gradient(145deg, #2a2a2a, #111);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      margin-top: 8px;
      color: #d4af37;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 1px;
      border: 1px solid #444;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    
    /* SLEEK PANELS */
    .panel {
      background: linear-gradient(145deg, #222, #181818);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-top: 25px;
      text-align: left;
      box-shadow: 0 8px 16px rgba(0,0,0,0.6);
    }
    .panel h3 { 
      margin-top: 0; 
      color: #d4af37; 
      text-align: center; 
      border-bottom: 1px solid #333; 
      padding-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 16px;
    }

    /* INPUTS & DROPDOWNS */
    label { font-size: 14px; color: #aaa; margin-bottom: 5px; display: block; }
    input, select {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background-color: #111;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    input:focus, select:focus { outline: none; border-color: #d4af37; }
    
    .btn-submit { background: linear-gradient(145deg, #28a745, #145523); color: white; border-color: #28a745; width: 100%; }
    
    /* LIVE QUEUE TICKETS */
    .ticket {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #d4af37;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ticket-number { font-size: 16px; font-weight: bold; color: #d4af37; background: #111; padding: 4px 10px; border-radius: 6px; border: 1px solid #444; }
    .ticket-title { font-size: 16px; font-weight: bold; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
    .ticket-details { font-size: 14px; color: #aaa; margin-bottom: 12px; line-height: 1.4; }
    .ticket-details strong { color: #d4af37; }
    
    .status-badge {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffc107, #b28704);
      color: #111;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    
    .btn-action { width: 100%; padding: 12px; font-size: 14px; margin-top: 5px; }
    .btn-finish { background: linear-gradient(145deg, #444, #222); color: #fff; border-color: #666; }
    .btn-pay { background: linear-gradient(145deg, #28a745, #145523); color: white; border-color: #28a745; }

    /* ANALYTICS GRID */
    #analyticsPanel { border-color: #145523; background: linear-gradient(145deg, #18281a, #0d140e); }
    #analyticsTitle { color: #28a745; border-color: #145523; margin-bottom: 20px; }
    
    .stats-grid { display: flex; justify-content: space-between; gap: 8px; }
    .stat-box { 
      flex: 1; 
      background: rgba(0,0,0,0.4); 
      padding: 12px 5px; 
      border-radius: 8px; 
      text-align: center; 
      border: 1px solid #145523; 
    }
    .stat-box p { color: #888; font-size: 11px; text-transform: uppercase; margin: 0 0 5px 0; letter-spacing: 0.5px; }
    .stat-box .money { margin: 0; color: #28a745; font-size: 15px; font-weight: bold; }
    .stat-box .cuts { margin: 5px 0 0 0; color: #bbb; font-size: 12px; }
  </style>
</head>
<body>

  <h1>SJ'S SALOON</h1>
  <p id="statusText" style="color: #888;">Please log in to continue.</p>
  
  <button id="loginBtn">Sign in with Google</button>

  <div id="dashboard">
    <img id="userPic" src="" alt="Profile Picture">
    <h3 id="userName"></h3>
    <div id="userRole">Role: LOADING...</div>
    
    <!-- SECRETARY FRONT DESK PANEL -->
    <div id="secretaryPanel" class="panel" style="display: none;">
      <h3>Front Desk Intake</h3>
      <label>Customer Name</label>
      <input type="text" id="custName" placeholder="Enter full name...">

      <label>Service Type</label>
      <select id="serviceType">
        <option value="Adult Fade|50">Adult Fade - 50.00 GHS</option>
        <option value="Line-Up|20">Line-Up - 20.00 GHS</option>
        <option value="Kids Cut|30">Kids Cut - 30.00 GHS</option>
      </select>

      <label>Assign To Barber</label>
      <select id="barberName">
        <option value="Angel">Angel</option>
        <option value="Gideon">Gideon</option>
      </select>

      <button id="sendBtn" class="btn-submit">Issue Ticket & Send to Chair</button>
    </div>

    <!-- LIVE SHOP QUEUE -->
    <div id="queuePanel" class="panel" style="display: none;">
      <h3>Live Shop Queue</h3>
      <div id="queueList"></div>
    </div>

    <!-- ANALYTICS PANEL -->
    <div id="analyticsPanel" class="panel" style="display: none;">
      <h3 id="analyticsTitle">Shop Analytics</h3>
      <div class="stats-grid">
        <div class="stat-box">
          <p>Today</p>
          <h2 class="money">GHS <span id="todayRev">0.00</span></h2>
          <p class="cuts"><span id="todayCuts">0</span> cuts</p>
        </div>
        <div class="stat-box">
          <p>This Week</p>
          <h2 class="money">GHS <span id="weekRev">0.00</span></h2>
          <p class="cuts"><span id="weekCuts">0</span> cuts</p>
        </div>
        <div class="stat-box">
          <p>This Month</p>
          <h2 class="money">GHS <span id="monthRev">0.00</span></h2>
          <p class="cuts"><span id="monthCuts">0</span> cuts</p>
        </div>
      </div>
    </div>
    
    <button id="logoutBtn">Log Out</button>
  </div>

  <script type="module" defer>
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0YvP-aj1a_ReSpYlOuyS0FM6WlbrP7aI",
      authDomain: "sjs-saloon.firebaseapp.com",
      projectId: "sjs-saloon",
      storageBucket: "sjs-saloon.firebasestorage.app",
      messagingSenderId: "346208182886",
      appId: "1:346208182886:web:0766d465a0c628bd5c03a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentRole = ""; 

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const dashboard = document.getElementById('dashboard');
    const statusText = document.getElementById('statusText');
    const userRoleDisplay = document.getElementById('userRole');
    
    const secretaryPanel = document.getElementById('secretaryPanel');
    const queuePanel = document.getElementById('queuePanel');
    const analyticsPanel = document.getElementById('analyticsPanel');
    const analyticsTitle = document.getElementById('analyticsTitle');

    loginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      signInWithPopup(auth, provider).catch((error) => alert("Login failed: " + error.message));
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => window.location.reload());
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = "none";
        statusText.style.display = "none";
        dashboard.style.display = "block";
        queuePanel.style.display = "block";
        
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userPic').src = user.photoURL;

        if (user.email === "gismartsghana@gmail.com") {
          currentRole = "owner";
          userRoleDisplay.innerText = "👑 ROLE: SHOP OWNER";
          secretaryPanel.style.display = "block"; 
          analyticsPanel.style.display = "block"; 
          analyticsTitle.innerText = "The Vault (Shop Revenue)";
          startLiveQueue(); 
          startAnalyticsTracker(); 
        } else if (user.email === "kuukua@gmail.com") {
          currentRole = "secretary";
          userRoleDisplay.innerText = "👩‍💼 ROLE: SECRETARY";
          secretaryPanel.style.display = "block";
          analyticsPanel.style.display = "block"; 
          analyticsTitle.innerText = "Shop Revenue Tracker";
          startLiveQueue();
          startAnalyticsTracker(); 
        } else {
          currentRole = "barber";
          userRoleDisplay.innerText = "👤 ROLE: BARBER";
          analyticsPanel.style.display = "block"; 
          analyticsTitle.innerText = "My Work History";
          startLiveQueue();
          startAnalyticsTracker(user.displayName); 
        }

      } else {
        loginBtn.style.display = "inline-block";
        statusText.style.display = "block";
        dashboard.style.display = "none";
      }
    });

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const name = document.getElementById('custName').value;
      const serviceData = document.getElementById('serviceType').value.split('|'); 
      const barber = document.getElementById('barberName').value;

      if (name.trim() === "") return alert("Please enter the customer's name!");

      try {
        const querySnapshot = await getDocs(collection(db, "daily_tickets"));
        const ticketCount = querySnapshot.size + 1;
        const ticketNumber = "Ticket #" + String(ticketCount).padStart(3, '0');

        await addDoc(collection(db, "daily_tickets"), {
          ticketNo: ticketNumber,
          customerName: name,
          serviceName: serviceData[0],
          price: Number(serviceData[1]),
          assignedBarber: barber,
          status: "in_progress",
          timestamp: new Date().getTime()
        });
        document.getElementById('custName').value = "";
      } catch (error) {
        alert("Error saving: " + error.message);
      }
    });

    window.promptPayment = (ticketId) => {
      let method = prompt("Select Payment Method:\n1. Cash\n2. MTN MoMo\n3. Telecel Cash\n4. Card", "Cash");
      if (!method) return;
      
      let paymentMethod = "Cash";
      const m = method.toLowerCase();
      if (m.includes("momo") || m.includes("mtn")) paymentMethod = "MTN MoMo";
      else if (m.includes("telecel") || m.includes("vodafone")) paymentMethod = "Telecel Cash";
      else if (m.includes("card")) paymentMethod = "Card";

      updateTicketStatus(ticketId, 'paid', paymentMethod);
    };

    window.updateTicketStatus = async (ticketId, newStatus, paymentMethod = null) => {
      try {
        const ticketRef = doc(db, "daily_tickets", ticketId);
        let updateData = { status: newStatus };
        if (paymentMethod) {
          updateData.paymentMethod = paymentMethod;
        }
        await updateDoc(ticketRef, updateData);
      } catch (error) {
        alert("Action failed: " + error.message);
      }
    };

    function startLiveQueue() {
      const queueList = document.getElementById('queueList');
      
      onSnapshot(collection(db, "daily_tickets"), (snapshot) => {
        let html = "";
        
        snapshot.forEach((docSnap) => {
          const ticket = docSnap.data();
          const ticketId = docSnap.id; 
          
          if (ticket.status !== "paid") {
            let actionButton = "";
            
            if (ticket.status === "in_progress" && (currentRole === "barber" || currentRole === "owner")) {
               actionButton = `<button class="btn-action btn-finish" onclick="updateTicketStatus('${ticketId}', 'completed')">FINISH CUT</button>`;
            } else if (ticket.status === "completed" && (currentRole === "secretary" || currentRole === "owner")) {
               actionButton = `<button class="btn-action btn-pay" onclick="promptPayment('${ticketId}')">COLLECT PAYMENT</button>`;
            }

            html += `
              <div class="ticket">
                <div class="ticket-header">
                  <span class="ticket-number">${ticket.ticketNo || 'Ticket #--'}</span>
                  <span class="status-badge">${ticket.status.toUpperCase().replace('_', ' ')}</span>
                </div>
                <div class="ticket-title">${ticket.customerName}</div>
                <div class="ticket-details">
                  ${ticket.serviceName} - GHS ${ticket.price.toFixed(2)} <br>
                  Assigned to: <strong>${ticket.assignedBarber}</strong>
                </div>
                ${actionButton}
              </div>
            `;
          }
        });
        
        queueList.innerHTML = html === "" ? "<p style='color:#666; font-style: italic;'>No active customers in the shop.</p>" : html;
      });
    }

    function startAnalyticsTracker(barberNameFilter = null) {
      onSnapshot(collection(db, "daily_tickets"), (snapshot) => {
        let todayVal = 0, todayCuts = 0;
        let weekVal = 0, weekCuts = 0;
        let monthVal = 0, monthCuts = 0;
        
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        snapshot.forEach((docSnap) => {
          const ticket = docSnap.data();
          if (ticket.status === "paid") {
            if (barberNameFilter) {
              const firstName = barberNameFilter.split(' ')[0].toLowerCase();
              if (ticket.assignedBarber.toLowerCase() !== firstName) return;
            }

            const amount = ticket.price;

            const time = ticket.timestamp;
            if (time >= startOfToday) {
              todayVal += amount;
              todayCuts++;
            }
            if (time >= startOfWeek) {
              weekVal += amount;
              weekCuts++;
            }
            if (time >= startOfMonth) {
              monthVal += amount;
              monthCuts++;
            }
          }
        });

        document.getElementById('todayRev').innerText = todayVal.toFixed(2);
        document.getElementById('todayCuts').innerText = todayCuts;
        document.getElementById('weekRev').innerText = weekVal.toFixed(2);
        document.getElementById('weekCuts').innerText = weekCuts;
        document.getElementById('monthRev').innerText = monthVal.toFixed(2);
        document.getElementById('monthCuts').innerText = monthCuts;
      });
    }
  </script>
</body>
</html>
