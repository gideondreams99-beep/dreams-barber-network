<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJ'S SALOON</title>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #1a1a1a; 
      color: white; 
      text-align: center; 
      padding: 20px; 
    }
    button { 
      padding: 12px 24px; 
      font-size: 16px; 
      background-color: #4285F4; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      margin-top: 20px;
    }
    #dashboard { 
      display: none; 
      margin-top: 30px; 
    }
    img { 
      border-radius: 50%; 
      width: 100px; 
      height: 100px; 
      border: 3px solid #d4af37;
      margin-bottom: 10px;
    }
    h2 { margin: 0; }
    p { margin: 5px 0; }
    #userRole {
      background-color: #333;
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>SJ'S SALOON</h1>
  <p id="statusText">Please log in to continue.</p>
  
  <button id="loginBtn">Sign in with Google</button>

  <div id="dashboard">
    <img id="userPic" src="" alt="Profile Picture">
    <h2 id="userName"></h2>
    <p id="userEmail"></p>
    <p id="userRole" style="color: #d4af37; font-weight: bold;">Loading role...</p>
    <br>
    <button id="logoutBtn" style="background-color: #ff4444;">Log Out</button>
  </div>

  <script type="module" defer>
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // CHANGED: Replaced signInWithPopup with signInWithRedirect
    import { getAuth, signInWithRedirect, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0YvP-aj1a_ReSpYlOuyS0FM6WlbrP7aI",
      authDomain: "sjs-saloon.firebaseapp.com",
      projectId: "sjs-saloon",
      storageBucket: "sjs-saloon.firebasestorage.app",
      messagingSenderId: "346208182886",
      appId: "1:346208182886:web:0766d465a0c628bd5c03a7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const dashboard = document.getElementById('dashboard');
    const statusText = document.getElementById('statusText');
    const userRoleDisplay = document.getElementById('userRole');

    // Handle Login using Redirect instead of Popup
    loginBtn.addEventListener('click', () => {
      signInWithRedirect(auth, provider);
    });

    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginBtn.style.display = "none";
        statusText.style.display = "none";
        dashboard.style.display = "block";
        
        document.getElementById('userName').innerText = user.displayName;
        document.getElementById('userEmail').innerText = user.email;
        document.getElementById('userPic').src = user.photoURL;

        const userRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const userData = docSnap.data();
          
          if (userData.is_active === false) {
             alert("Access Denied: Your account has been deactivated by the Owner.");
             signOut(auth);
             return;
          }
          
          userRoleDisplay.innerText = "Role: " + userData.role.toUpperCase();
        } else {
          await setDoc(userRef, {
            name: user.displayName,
            email: user.email,
            role: "pending", 
            is_active: true
          });
          userRoleDisplay.innerText = "Role: PENDING (Waiting for Owner)";
        }
      } else {
        loginBtn.style.display = "inline-block";
        statusText.style.display = "block";
        dashboard.style.display = "none";
      }
    });
  </script>
</body>
</html>
