<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJ'S SALOON — Management System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 100%);
  color: #e0e0e0;
  text-align: center;
  padding: 15px;
  margin: 0;
  min-height: 100vh;
}

h1 {
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #d4af37;
  text-shadow: 2px 2px 4px rgba(0,0,0,.8);
  margin-top: 10px;
}

h2, h3 {
  color: #d4af37;
}

button {
  padding: 14px 24px;
  font-size: 15px;
  font-weight: bold;
  background: linear-gradient(145deg,#333,#111);
  color: #d4af37;
  border: 1px solid #555;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 3px 3px 8px rgba(0,0,0,.6);
  text-transform: uppercase;
  letter-spacing: 1px;
}

button:active {
  transform: translateY(1px);
  box-shadow: inset 2px 2px 5px rgba(0,0,0,.8);
}

button:hover {
  filter: brightness(1.15);
}

#loginBtn {
  background: linear-gradient(145deg,#1a4b8c,#0a2342);
  color: white;
  border-color: #2a6bcc;
}

#logoutBtn {
  background: linear-gradient(145deg,#8c1a1a,#420a0a);
  color: white;
  border-color: #cc2a2a;
  margin-top: 30px;
  width: 100%;
}

img {
  border-radius: 50%;
  width: 90px;
  height: 90px;
  border: 2px solid #d4af37;
  margin-bottom: 5px;
  box-shadow: 0 4px 10px rgba(0,0,0,.8);
}

#dashboard {
  display:none;
  margin-top:15px;
}

#userName {
  margin:5px 0 0;
}

#userRole {
  background:linear-gradient(145deg,#2a2a2a,#111);
  display:inline-block;
  padding:6px 18px;
  border-radius:20px;
  margin-top:8px;
  color:#d4af37;
  font-weight:bold;
  font-size:12px;
  letter-spacing:1px;
  border:1px solid #444;
}

.panel {
  background:linear-gradient(145deg,#222,#181818);
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-top:25px;
  text-align:left;
  box-shadow:0 8px 16px rgba(0,0,0,.6);
}

.panel h3 {
  margin-top:0;
  text-align:center;
  border-bottom:1px solid #333;
  padding-bottom:12px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:16px;
}

label {
  font-size:14px;
  color:#aaa;
  margin-bottom:5px;
  display:block;
}

input,
select {
  width:100%;
  padding:14px;
  margin-bottom:18px;
  background:#111;
  color:white;
  border:1px solid #444;
  border-radius:8px;
  font-size:16px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.8);
}

input:focus,
select:focus {
  outline:none;
  border-color:#d4af37;
}

.btn-submit {
  background:linear-gradient(145deg,#28a745,#145523);
  color:white;
  border-color:#28a745;
  width:100%;
}

.btn-blue {
  background:linear-gradient(145deg,#246bb2,#102f50);
  color:white;
  border-color:#3987d7;
  width:100%;
}

.btn-danger {
  background:linear-gradient(145deg,#8c1a1a,#420a0a);
  color:white;
  border-color:#cc2a2a;
}

.btn-action {
  width:100%;
  padding:12px;
  font-size:13px;
  margin-top:6px;
}

.btn-finish {
  background:linear-gradient(145deg,#444,#222);
  color:white;
  border-color:#666;
}

.btn-pay {
  background:linear-gradient(145deg,#28a745,#145523);
  color:white;
  border-color:#28a745;
}

.ticket {
  background:linear-gradient(145deg,#2a2a2a,#1a1a1a);
  padding:16px;
  border-radius:10px;
  margin-bottom:15px;
  border-left:4px solid #d4af37;
  box-shadow:0 4px 8px rgba(0,0,0,.4);
}

.ticket-number {
  font-size:14px;
  color:#d4af37;
  font-weight:bold;
  margin-bottom:5px;
}

.ticket-title {
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
  color:#fff;
  text-transform:uppercase;
}

.ticket-details {
  font-size:14px;
  color:#aaa;
  margin-bottom:12px;
  line-height:1.6;
}

.ticket-details strong {
  color:#d4af37;
}

.status-badge {
  font-size:11px;
  padding:5px 10px;
  border-radius:12px;
  background:linear-gradient(145deg,#ffc107,#b28704);
  color:#111;
  font-weight:bold;
  display:inline-block;
  margin-bottom:10px;
  letter-spacing:1px;
}

.stats-grid {
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.stat-box {
  flex:1;
  min-width:90px;
  background:rgba(0,0,0,.4);
  padding:12px 5px;
  border-radius:8px;
  text-align:center;
  border:1px solid #145523;
}

.stat-box p {
  color:#888;
  font-size:11px;
  text-transform:uppercase;
  margin:0 0 5px;
}

.stat-box .money {
  margin:0;
  color:#28a745;
  font-size:15px;
}

.stat-box .cuts {
  margin:5px 0 0;
  color:#bbb;
  font-size:12px;
}

.search-box {
  margin-bottom:15px;
}

.customer-card,
.appointment-card {
  background:linear-gradient(145deg,#292929,#181818);
  border:1px solid #3a3a3a;
  border-left:4px solid #d4af37;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.customer-name {
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

.small-text {
  color:#999;
  font-size:13px;
  line-height:1.6;
}

.gold {
  color:#d4af37;
}

.green {
  color:#28a745;
}

.red {
  color:#e74c3c;
}

.blue {
  color:#5da9ff;
}

.queue-number-big {
  font-size:30px;
  font-weight:bold;
  color:#d4af37;
}

.tabs {
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-top:20px;
}

.tab-btn {
  flex:1;
  min-width:110px;
  padding:11px 8px;
  font-size:11px;
}

.hidden {
  display:none !important;
}

.empty {
  color:#666;
  text-align:center;
  padding:20px;
  font-style:italic;
}

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal-content {
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow-y:auto;
  background:linear-gradient(145deg,#242424,#111);
  border:1px solid #555;
  border-radius:14px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.8);
}

.close-btn {
  float:right;
  padding:7px 12px;
  font-size:12px;
}

.customer-stat {
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #333;
}

@media(max-width:600px) {
  body {
    padding:10px;
  }

  .panel {
    padding:15px;
  }

  .stats-grid {
    gap:5px;
  }

  .stat-box {
    min-width:29%;
  }

  h1 {
    font-size:25px;
  }
}
</style>
</head>

<body>

<button id="loginBtn">Sign in with Google</button>

<!-- CUSTOMER PROFILE MODAL -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";

import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  updateDoc,
  setDoc,
  getDoc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyD0YvP-aj1a_ReSpYlOuyS0FM6WlbrP7aI",

  authDomain: "sjs-saloon.firebaseapp.com",

  projectId: "sjs-saloon",

  storageBucket: "sjs-saloon.firebasestorage.app",

  messagingSenderId: "346208182886",

  appId: "1:346208182886:web:0766d465a0c628bd5c03a7"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* =========================
   GLOBAL STATE
========================= */

let currentRole = "";

let currentUser = null;

let allCustomers = [];

let allAppointments = [];

let allTickets = [];

let queueListener = null;

let customerListener = null;

let appointmentListener = null;


/* =========================
   ELEMENTS
========================= */

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const dashboard =
  document.getElementById("dashboard");

const statusText =
  document.getElementById("statusText");

const userRoleDisplay =
  document.getElementById("userRole");


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener("click", async (e) => {

  e.preventDefault();

  try {

    await signInWithPopup(auth, provider);

  } catch(error) {

    alert("Login failed: " + error.message);

  }

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

  window.location.reload();

});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, (user) => {

  if(user) {

    currentUser = user;

    loginBtn.style.display = "none";

    statusText.style.display = "none";

    dashboard.style.display = "block";

    document.getElementById("userName").innerText =
      user.displayName || "User";

    document.getElementById("userPic").src =
      user.photoURL || "";

    determineRole(user);

    startLiveQueue();

    startCustomerDatabase();

    startAppointments();

    startAnalyticsTracker();

  } else {

    loginBtn.style.display = "inline-block";

    statusText.style.display = "block";

    dashboard.style.display = "none";

  }

});


/* =========================
   ROLE SYSTEM
========================= */

function determineRole(user) {

  if(user.email === "gismartsghana@gmail.com") {

    currentRole = "owner";

    userRoleDisplay.innerText =
      "👑 ROLE: SHOP OWNER";

  }

  else if(user.email === "kuukua@gmail.com") {

    currentRole = "secretary";

    userRoleDisplay.innerText =
      "👩‍💼 ROLE: SECRETARY";

  }

  else {

    currentRole = "barber";

    userRoleDisplay.innerText =
      "✂️ ROLE: BARBER";

  }

}


/* =========================
   SECTION NAVIGATION
========================= */

window.showSection = function(sectionId) {

  const sections = [
    "secretaryPanel",
    "queuePanel",
    "appointmentPanel",
    "customersPanel",
    "analyticsPanel"
  ];

  sections.forEach(id => {

    const el = document.getElementById(id);

    if(el) {

      el.style.display =
        id === sectionId ? "block" : "none";

    }

  });

};


/* =========================
   INITIAL SECTION
========================= */

window.addEventListener("load", () => {

  setTimeout(() => {

    showSection("queuePanel");

  }, 500);

});


/* =========================
   CUSTOMER INTAKE
========================= */

document
.getElementById("sendBtn")
.addEventListener("click", async () => {

  const name =
    document.getElementById("custName").value.trim();

  const phone =
    document.getElementById("custPhone").value.trim();

  const serviceData =
    document.getElementById("serviceType").value.split("|");

  const barber =
    document.getElementById("barberName").value;

  const customerType =
    document.getElementById("customerType").value;


  if(!name) {

    alert("Please enter the customer's name.");

    return;

  }


  if(!phone) {

    alert("Please enter the customer's phone number.");

    return;

  }


  try {

    /* CREATE / UPDATE CUSTOMER */

    await createOrUpdateCustomer(
      name,
      phone
    );


    /* GENERATE QUEUE NUMBER */

    const queueNumber =
      await generateQueueNumber();


    /* CREATE TICKET */

    await addDoc(
      collection(db, "daily_tickets"),
      {

        queueNumber,

        customerName: name,

        customerPhone: phone,

        serviceName: serviceData[0],

        price: Number(serviceData[1]),

        duration: Number(serviceData[2]),

        assignedBarber: barber,

        customerType,

        status: "in_progress",

        paymentMethod: "",

        timestamp: Date.now(),

        createdBy:
          currentUser ? currentUser.uid : ""

      }
    );


    /* CLEAR FORM */

    document.getElementById("custName").value = "";

    document.getElementById("custPhone").value = "";


    alert(
      `Customer added successfully!\n\nQueue Number: ${queueNumber}`
    );


    showSection("queuePanel");


  } catch(error) {

    alert(
      "Could not create customer: " +
      error.message
    );

  }

});


/* =========================
   CUSTOMER CREATION
========================= */

async function createOrUpdateCustomer(name, phone) {

  const customerId =
    normalizePhone(phone);


  const customerRef =
    doc(db, "customers", customerId);


  const existing =
    await getDoc(customerRef);


  if(existing.exists()) {

    await updateDoc(customerRef, {

      name,

      phone,

      lastVisit: Date.now()

    });

  } else {

    await setDoc(customerRef, {

      name,

      phone,

      totalVisits: 0,

      totalSpent: 0,

      lastVisit: Date.now(),

      createdAt: Date.now()

    });

  }

}


/* =========================
   PHONE NORMALIZATION
========================= */

function normalizePhone(phone) {

  return phone
    .replace(/\D/g, "")
    .slice(-10);

}


/* =========================
   QUEUE NUMBER
========================= */

async function generateQueueNumber() {

  const today =
    new Date().toISOString().slice(0,10);

  const counterRef =
    doc(db, "queue_counters", today);

  const counterSnap =
    await getDoc(counterRef);


  let number = 1;


  if(counterSnap.exists()) {

    number =
      Number(counterSnap.data().number || 0) + 1;

  }


  await setDoc(counterRef, {

    number

  });


  return "SJ-" +
    String(number).padStart(3,"0");

}


/* =========================
   LIVE QUEUE
========================= */

function startLiveQueue() {

  const queueList =
    document.getElementById("queueList");


  if(queueListener) {

    queueListener();

  }


  queueListener =
    onSnapshot(
      collection(db,"daily_tickets"),
      (snapshot) => {

        allTickets = [];


        snapshot.forEach(docSnap => {

          allTickets.push({

            id: docSnap.id,

            ...docSnap.data()

          });

        });


        allTickets.sort(
          (a,b) =>
            Number(a.timestamp || 0) -
            Number(b.timestamp || 0)
        );


        renderQueue();

      },
      error => {

        console.error(
          "Queue error:",
          error
        );

      }
    );

}


/* =========================
   RENDER QUEUE
========================= */

function renderQueue() {

  const queueList =
    document.getElementById("queueList");


  let html = "";


  allTickets.forEach(ticket => {

    if(ticket.status === "paid") {

      return;

    }


    /* Barber sees only their own tickets */

    if(
      currentRole === "barber" &&
      ticket.assignedBarber &&
      ticket.assignedBarber.toLowerCase() !==
      (currentUser.displayName || "")
      .split(" ")[0]
      .toLowerCase()
    ) {

      return;

    }


    let actionButton = "";


    if(
      ticket.status === "in_progress" &&
      (
        currentRole === "barber" ||
        currentRole === "owner"
      )
    ) {

      actionButton = `
        <button
          class="btn-action btn-finish"
          onclick="finishTicket('${ticket.id}')"
        >
          FINISH CUT
        </button>
      `;

    }


    if(
      ticket.status === "completed" &&
      (
        currentRole === "secretary" ||
        currentRole === "owner"
      )
    ) {

      actionButton = `
        <button
          class="btn-action btn-pay"
          onclick="collectPayment('${ticket.id}')"
        >
          COLLECT PAYMENT
        </button>
      `;

    }


    const type =
      ticket.customerType === "appointment"
        ? "📅 APPOINTMENT"
        : "🚶 WALK-IN";


    html += `

      <div class="ticket">

        <div class="queue-number-big">
          ${escapeHtml(ticket.queueNumber || "—")}
        </div>

        <div class="ticket-title">
          ${escapeHtml(ticket.customerName || "")}
        </div>

        <div class="ticket-details">

          📞 ${escapeHtml(ticket.customerPhone || "No phone")}<br>

          ✂️ ${escapeHtml(ticket.serviceName || "")}<br>

          💰 GHS ${Number(ticket.price || 0).toFixed(2)}<br>

          ⏱️ ${Number(ticket.duration || 0)} minutes<br>

          👤 Assigned to:
          <strong>
            ${escapeHtml(ticket.assignedBarber || "")}
          </strong>

          <br>

          ${type}

        </div>

        <span class="status-badge">
          ${escapeHtml(
            String(ticket.status || "")
            .replace("_"," ")
            .toUpperCase()
          )}
        </span>

        ${actionButton}

      </div>

    `;

  });


  queueList.innerHTML =
    html ||
    `<div class="empty">
      No active customers in the shop.
    </div>`;

}

        completedBy:

    );

/* =========================
   COLLECT PAYMENT
========================= */

window.collectPayment = async function(ticketId) {

  const method =
    prompt(
      "Enter payment method:\n\n1 = Cash\n2 = MTN MoMo\n3 = Telecel Cash\n4 = AirtelTigo Money\n5 = Card"
    );


  if(!method) return;


  const methods = {

    "1":"Cash",

    "2":"MTN MoMo",

    "3":"Telecel Cash",

    "4":"AirtelTigo Money",

    "5":"Card"

  };


  const paymentMethod =
    methods[method] || method;


  try {

    const ticket =
      allTickets.find(
        t => t.id === ticketId
      );


    if(!ticket) {

      alert("Ticket not found.");

      return;

    }


    await updateDoc(
      doc(db,"daily_tickets",ticketId),
      {

        status:"paid",

        paymentMethod,

        paidAt:Date.now(),

        paidBy:
          currentUser
            ? currentUser.displayName
            : ""

      }
    );


    /* UPDATE CUSTOMER TOTALS */

    await updateCustomerAfterPayment(
      ticket
    );


    alert(
      `Payment recorded.\n\nMethod: ${paymentMethod}\nAmount: GHS ${Number(ticket.price).toFixed(2)}`
    );


  } catch(error) {

    alert(
      "Payment failed: " +
      error.message
    );

  }

};


/* =========================
   UPDATE CUSTOMER AFTER PAYMENT
========================= */

async function updateCustomerAfterPayment(ticket) {

  if(!ticket.customerPhone) return;


  const id =
    normalizePhone(ticket.customerPhone);


  const ref =
    doc(db,"customers",id);


  const snap =
    await getDoc(ref);


  if(!snap.exists()) return;


  const data =
    snap.data();


  await updateDoc(ref, {

    totalVisits:
      Number(data.totalVisits || 0) + 1,

    totalSpent:
      Number(data.totalSpent || 0) +
      Number(ticket.price || 0),

    lastVisit:
      Date.now()

  });

}


/* =========================
   CUSTOMER DATABASE
========================= */

function startCustomerDatabase() {

  if(customerListener) {

    customerListener();

  }


  customerListener =
    onSnapshot(
      collection(db,"customers"),
      snapshot => {

        allCustomers = [];


        snapshot.forEach(docSnap => {

          allCustomers.push({

            id:docSnap.id,

            ...docSnap.data()

          });

        });


        allCustomers.sort(
          (a,b) =>
            Number(b.lastVisit || 0) -
            Number(a.lastVisit || 0)
        );


        renderCustomers();

      }
    );


  document
  .getElementById("customerSearch")
  .addEventListener(
    "input",
    renderCustomers
  );

}


/* =========================
   RENDER CUSTOMERS
========================= */

function renderCustomers() {

  const list =
    document.getElementById("customersList");


  const search =
    (
      document
      .getElementById("customerSearch")
      .value || ""
    )
    .toLowerCase()
    .trim();


  const filtered =
    allCustomers.filter(customer =>

      String(customer.name || "")
      .toLowerCase()
      .includes(search)

      ||

      String(customer.phone || "")
      .includes(search)

    );


  if(!filtered.length) {

    list.innerHTML =
      `<div class="empty">
        No customers found.
      </div>`;

    return;

  }


  list.innerHTML =
    filtered.map(customer => `

      <div class="customer-card">

        <div class="customer-name">

          ${escapeHtml(customer.name || "Unknown")}

        </div>

        <div class="small-text">

          📞 ${escapeHtml(customer.phone || "")}<br>

          ✂️ ${Number(customer.totalVisits || 0)}
          visits<br>

          💰 GHS
          ${Number(customer.totalSpent || 0).toFixed(2)}
          spent

        </div>

        <button
          class="btn-action btn-blue"
          onclick="viewCustomer('${customer.id}')"
        >
          VIEW CUSTOMER
        </button>

      </div>

    `).join("");

}


/* =========================
   CUSTOMER PROFILE
========================= */

window.viewCustomer = async function(customerId) {

  const customer =
    allCustomers.find(
      c => c.id === customerId
    );


  if(!customer) return;


  document
  .getElementById("modalCustomerName")
  .innerText =
    customer.name || "Customer";


  const visits =
    allTickets.filter(ticket =>

      normalizePhone(
        ticket.customerPhone || ""

    );


  let history = "";


  visits.forEach(ticket => {

    history += `

      <div

          ${escapeHtml(ticket.serviceName || "")}

        <br>

  .getElementById("customerDetails")
  .innerHTML = `

      <strong>

      </strong>

    </div>

    <div class="customer-stat">

      <span>Total Visits</span>

      <strong class="gold">
        ${Number(customer.totalVisits || 0)}
      </strong>

    </div>

    <div class="customer-stat">

      <span>Total Spent</span>

      <strong class="green">
        GHS ${Number(customer.totalSpent || 0).toFixed(2)}
      </strong>

    </div>

    <div class="customer-stat">

      <span>Last Visit</span>

      <strong>
        ${formatDate(customer.lastVisit)}
      </strong>

    </div>

    <h3 style="margin-top:25px;">
      Visit History
    </h3>

    ${
      history ||
      `<div class="empty">

      </div>`
    }

  document
  .getElementById("customerModal")
  .style.display = "flex";

};


window.closeCustomerModal = function() {

  document
  .getElementById("customerModal")
  .style.display = "none";

};


/* =========================
   APPOINTMENTS
========================= */

document
.getElementById("bookAppointmentBtn")
.addEventListener("click", async () => {

    document
    .getElementById("appointmentName")
    .value.trim();

    document
    .getElementById("appointmentPhone")
    .value.trim();

/* =========================
   ANALYTICS
========================= */

function startAnalyticsTracker() {

  onSnapshot(
    collection(db,"daily_tickets"),
    snapshot => {

      let todayCash = 0;

      let todayCuts = 0;

      let weekCash = 0;

      let weekCuts = 0;

      let monthCash = 0;

      let monthCuts = 0;


      const now = new Date();


      const startOfToday =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        ).getTime();


      const startOfWeek =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() -
          now.getDay()
        ).getTime();


      const startOfMonth =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          1
        ).getTime();


      snapshot.forEach(docSnap => {

        const ticket =
          docSnap.data();


        if(ticket.status !== "paid") {

          return;

        }


        /* Barber sees only own work */

        if(currentRole === "barber") {

          const firstName =
            (
              currentUser.displayName || ""
            )
            .split(" ")[0]
            .toLowerCase();


          if(
            String(ticket.assignedBarber || "")
            .toLowerCase() !== firstName
          ) {

            return;

          }

        }


        const time =
          Number(ticket.paidAt ||
          ticket.timestamp || 0);


        const price =
          Number(ticket.price || 0);


        if(time >= startOfToday) {

          todayCash += price;

          todayCuts++;

        }


        if(time >= startOfWeek) {

          weekCash += price;

          weekCuts++;

        }


        if(time >= startOfMonth) {

          monthCash += price;

          monthCuts++;

        }

      });


      document.getElementById("todayRev")
      .innerText =
        todayCash.toFixed(2);

      document.getElementById("todayCuts")
      .innerText =
        todayCuts;


      document.getElementById("weekRev")
      .innerText =
        weekCash.toFixed(2);

      document.getElementById("weekCuts")
      .innerText =
        weekCuts;


      document.getElementById("monthRev")
      .innerText =
        monthCash.toFixed(2);

      document.getElementById("monthCuts")
      .innerText =
        monthCuts;

    }
  );

}


/* =========================
   HELPERS
========================= */

function formatDate(timestamp) {

  if(!timestamp) return "—";

  return new Date(timestamp)
    .toLocaleDateString(
      "en-GH",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
